# EVEZ OpenClaw — Node Alpha (primary)
# fly app: openclaws-qol4-a
app = 'openclaws-qol4-a'
primary_region = 'ams'

[build]
  image = 'node:22-bookworm-slim'

[env]
  NODE_ENV = 'production'
  OPENCLAW_NODE_ID = 'alpha'
  OPENCLAW_STATE_DIR = '/data'
  OPENCLAW_MESH_BRAIN = 'https://openclaw-brain.fly.dev'
  MESH_PEERS = 'openclaw-beta.fly.dev:8893,openclaw-brain.fly.dev:8893'
  BRAIN_PORT = '8893'
  BROKER_PORT = '8894'
  GROQ_MODEL = 'llama-3.3-70b-versatile'

[processes]
  app = 'node dist/index.js gateway --allow-unconfigured --port 3000 --bind lan'
  brain = 'python3 /app/brain.py'

[[mounts]]
  source = 'openclaw_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  internal_port = 8893
  protocol = 'tcp'
  [[services.ports]]
    port = 8893

[[services]]
  internal_port = 8894
  protocol = 'tcp'
  [[services.ports]]
    port = 8894

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
